name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax check (whole repo)
        run: python -m compileall -q .

      - name: Lint maintained code (cli_agent)
        run: ruff check cli_agent

      - name: Lint Scott Studio
        run: ruff check studio studio_server.py tests

      # 最高優先：既有股票系統不得因 Studio 而回歸。
      # 這一步必須先於 Studio 測試，失敗即代表既有系統被破壞。
      - name: Stock app regression tests (blocking)
        run: python -m pytest tests/legacy -q

      - name: Scott Studio tests
        run: python -m pytest tests/studio -q

      - name: Alembic configuration check
        run: python -m alembic current

      - name: Assert migrations never touch legacy tables
        run: |
          if grep -rlnE "user_data|observation_engine|signal_confidence|daily_report|stress_test|alert_history" migrations/versions/; then
            echo "::error::Alembic migration references a legacy stock table"
            exit 1
          fi
          echo "OK: migrations only touch studio_* tables"

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose config
        run: |
          docker compose \
            --env-file deploy/compose/.env.example \
            -f deploy/compose/docker-compose.yml \
            config -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Production build
        working-directory: frontend
        run: npm run build
