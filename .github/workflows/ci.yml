name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax check (whole repo)
        run: python -m compileall -q .

      - name: Lint maintained code (cli_agent + tests + ohlcv_utils)
        run: ruff check cli_agent tests ohlcv_utils.py

      - name: Unit tests
        run: pytest
