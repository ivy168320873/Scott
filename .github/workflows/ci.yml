name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax check (whole repo)
        run: python -m compileall -q .

      - name: Lint maintained code (cli_agent + tests)
        run: ruff check cli_agent tests

      - name: Run unit tests
        # 僅跑本套件維護的測試（tests/）。其他子專案（如 polymarket_bot）
        # 有各自的測試與打包設定，不在此 workflow 範圍內。
        run: pytest -q tests
