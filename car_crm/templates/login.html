<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>存取驗證 · 車銷 CRM</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0d1117;--surface:#161b22;--border:#30363d;
        --text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--danger:#f85149}
  body{background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:34px 28px;width:100%;max-width:360px}
  .logo{text-align:center;margin-bottom:24px}
  .logo-icon{font-size:2.2rem;display:block;margin-bottom:8px}
  .logo-title{font-size:1.2rem;font-weight:700}
  .logo-sub{font-size:.75rem;color:var(--muted);margin-top:4px}
  label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:6px}
  input{width:100%;padding:12px 14px;font-size:16px;background:var(--bg);
    border:1px solid var(--border);border-radius:9px;color:var(--text);outline:none}
  input:focus{border-color:var(--accent)}
  button{width:100%;min-height:46px;margin-top:16px;border:none;border-radius:10px;
    background:var(--accent);color:#04101f;font-size:.95rem;font-weight:700;
    cursor:pointer;font-family:inherit}
  .flash{padding:10px 13px;border-radius:9px;margin-bottom:14px;font-size:.85rem;
    background:#2d1618;border:1px solid #5c2a2e;color:#ff9d9d}
</style>
</head>
<body>
<form class="card" method="post" action="{{ url_for('login') }}">
  <div class="logo">
    <span class="logo-icon">🚗</span>
    <div class="logo-title">車銷 CRM</div>
    <div class="logo-sub">請輸入存取碼</div>
  </div>

  {% with messages = get_flashed_messages() %}
    {% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}
  {% endwith %}

  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ next or '' }}">
  <label for="code">存取碼</label>
  <input id="code" name="code" type="password" autocomplete="current-password"
         inputmode="text" enterkeyhint="go" autofocus required>
  <button type="submit">進入</button>
</form>
</body>
</html>
