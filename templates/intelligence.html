<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Scott · 市場情報中樞</title>
  <style>
    *{box-sizing:border-box} :root{color-scheme:dark;--bg:#090d13;--card:#151b23;--card2:#1b222c;
      --line:#303946;--text:#edf2f7;--muted:#94a3b8;--blue:#58a6ff;--green:#3fb950;
      --red:#f85149;--yellow:#e3b341} body{margin:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    .shell{max-width:1040px;margin:auto;padding:18px 16px 60px}.top{display:flex;align-items:flex-start;
      justify-content:space-between;gap:14px;margin-bottom:18px}.eyebrow{font-size:12px;color:var(--blue);
      font-weight:700;letter-spacing:.08em}.top h1{font-size:24px;margin:5px 0}.sub{font-size:13px;color:var(--muted);
      line-height:1.55}.actions{display:flex;gap:8px;flex-shrink:0}.btn{border:1px solid var(--line);
      background:var(--card2);color:var(--text);padding:9px 13px;border-radius:9px;font-weight:700;
      cursor:pointer}.btn.primary{background:var(--blue);color:#07111d;border-color:var(--blue)}.btn:disabled{opacity:.55}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.metric,.panel{
      background:var(--card);border:1px solid var(--line);border-radius:13px}.metric{padding:14px}.metric b{
      display:block;font-size:21px;margin-bottom:4px}.metric span{font-size:12px;color:var(--muted)}
    .panel{margin:12px 0;overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;
      padding:13px 15px;background:var(--card2);border-bottom:1px solid var(--line)}.panel-head h2{
      margin:0;font-size:15px}.panel-body{padding:14px}.event{padding:14px 0;border-bottom:1px solid var(--line)}
    .event:first-child{padding-top:0}.event:last-child{border-bottom:0;padding-bottom:0}.meta{display:flex;
      flex-wrap:wrap;gap:7px;align-items:center;font-size:11px;color:var(--muted)}.tag{border:1px solid var(--line);
      border-radius:99px;padding:2px 7px}.bull{color:var(--green);border-color:rgba(63,185,80,.4)}
    .bear{color:var(--red);border-color:rgba(248,81,73,.4)}.mixed{color:var(--yellow)}.event h3{
      font-size:16px;line-height:1.4;margin:8px 0}.event p{font-size:13px;color:#c6d0dc;line-height:1.6;margin:6px 0}
    .event a{color:var(--blue);font-size:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .catalyst,.action,.gap{background:var(--card2);border:1px solid var(--line);border-radius:10px;
      padding:11px;margin-bottom:8px;font-size:13px;line-height:1.5}.cat-top{display:flex;justify-content:space-between;
      gap:10px;font-weight:700}.empty{color:var(--muted);font-size:13px;padding:6px 0}.notice{font-size:12px;
      color:var(--muted);line-height:1.55}.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;
      background:var(--muted);margin-right:6px}.status-dot.on{background:var(--green)}#toast{position:fixed;left:50%;
      bottom:24px;transform:translateX(-50%);background:#263141;border:1px solid var(--line);border-radius:9px;
      padding:10px 15px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:10}
    @media(max-width:700px){.top{display:block}.actions{margin-top:13px}.grid{grid-template-columns:1fr 1fr}
      .two{grid-template-columns:1fr}.top h1{font-size:21px}.shell{padding:14px 12px 50px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div>
        <div class="eyebrow">MARKET INTELLIGENCE</div>
        <h1>🧭 市場情報中樞</h1>
        <div class="sub" id="runState">讀取系統狀態中…</div>
      </div>
      <div class="actions">
        <button class="btn" onclick="location.href='/'">回主系統</button>
        <button class="btn primary" id="runBtn" onclick="runNow()">立即更新</button>
      </div>
    </header>

    <section class="grid">
      <div class="metric"><b id="articleCount">—</b><span>累積新聞</span></div>
      <div class="metric"><b id="newCount">—</b><span>本次新增</span></div>
      <div class="metric"><b id="holdingImpact">—</b><span>持股影響</span></div>
      <div class="metric"><b id="catalystCount">—</b><span>有效催化劑</span></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>重大事件與來源</h2><span class="notice" id="generatedAt"></span></div>
      <div class="panel-body" id="events"><div class="empty">尚無報告，請按「立即更新」。</div></div>
    </section>

    <section class="two">
      <div class="panel">
        <div class="panel-head"><h2>持股／觀察清單影響</h2></div>
        <div class="panel-body" id="catalysts"><div class="empty">尚無有效催化劑。</div></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>建議下一步</h2></div>
        <div class="panel-body" id="actions"><div class="empty">等待情報分析。</div></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>來源與設定狀態</h2></div>
      <div class="panel-body">
        <div id="providers" class="notice">讀取中…</div>
        <div id="gaps" style="margin-top:10px"></div>
        <p class="notice" style="margin:14px 0 0">新聞僅能微調決策分數最多 ±8 分；低可信度、混合訊號或無直接關聯時不調分。系統維持模擬交易，不會因新聞自動真實下單。</p>
      </div>
    </section>
  </main>
  <div id="toast"></div>
  <script>
    const esc = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const safeUrl = v => { try { const u=new URL(String(v)); return ['http:','https:'].includes(u.protocol)?u.href:''; } catch { return ''; } };
    const directionClass = v => v==='BULLISH'?'bull':v==='BEARISH'?'bear':v==='MIXED'?'mixed':'';
    function toast(message){const el=document.getElementById('toast');el.textContent=message;el.style.opacity='1';clearTimeout(el.t);el.t=setTimeout(()=>el.style.opacity='0',3200)}
    function renderEvents(events){
      const el=document.getElementById('events');
      if(!events?.length){el.innerHTML='<div class="empty">本次沒有取得可用新聞；系統不會虛構內容。</div>';return}
      el.innerHTML=events.map(e=>{const url=safeUrl(e.url);return `<article class="event">
        <div class="meta"><span class="tag ${directionClass(e.direction)}">${esc(e.direction||'NEUTRAL')}</span>
        <span>重要度 ${esc(e.importance)}</span><span>信心 ${esc(e.confidence)}</span>
        <span>${esc((e.affected_symbols||[]).join(', ')||'市場')}</span><span>${esc(e.publisher||'')}</span></div>
        <h3>${esc(e.title||'未命名事件')}</h3><p><b>事實：</b>${esc(e.fact||e.summary||'來源未提供摘要')}</p>
        <p><b>推論：</b>${esc(e.inference||'尚無明確推論')}</p>${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">查看原始來源 ↗</a>`:''}
      </article>`}).join('');
    }
    function renderCatalysts(items){
      const el=document.getElementById('catalysts');
      if(!items?.length){el.innerHTML='<div class="empty">目前沒有直接影響持股或觀察清單的事件。</div>';return}
      el.innerHTML=items.map(c=>`<div class="catalyst"><div class="cat-top"><span>${esc(c.symbol)}</span>
        <span class="${directionClass(c.direction)}">${esc(c.direction)} ${Number(c.score_adjustment)>0?'+':''}${esc(c.score_adjustment)}</span></div>
        <div class="notice">重要度 ${esc(c.importance)} · 信心 ${esc(c.confidence)}</div><div>${esc(c.summary)}</div></div>`).join('');
    }
    function renderActions(items){document.getElementById('actions').innerHTML=(items?.length?items.map(a=>
      `<div class="action"><b>${esc(a.priority)} · ${esc(a.symbol)}</b><br>${esc(a.action)}<div class="notice">${esc(a.reason||'')}</div></div>`).join(''):'<div class="empty">沒有立即行動。</div>')}
    function renderProviders(config, health){
      const providers=config?.providers||{};const labels={yahoo:'Yahoo',finnhub:'Finnhub',alpha_vantage:'Alpha Vantage',anthropic:'Claude AI'};
      document.getElementById('providers').innerHTML=Object.entries(labels).map(([k,label])=>{
        const on=!!providers[k], h=health?.[k]; const detail=h?` · 成功 ${h.succeeded||0}/${h.attempted||0}`:'';
        return `<span style="display:inline-block;margin:3px 12px 3px 0"><i class="status-dot ${on?'on':''}"></i>${esc(label)}${esc(detail)}</span>`}).join('');
    }
    async function load(){
      try{
        const [sr,rr,cr]=await Promise.all([fetch('/api/intelligence/status'),fetch('/api/intelligence/latest'),fetch('/api/intelligence/catalysts')]);
        const s=await sr.json(), r=await rr.json(), c=await cr.json(), report=r.report;
        document.getElementById('articleCount').textContent=s.storage?.article_count??0;
        document.getElementById('catalystCount').textContent=s.storage?.active_catalysts??0;
        document.getElementById('runState').innerHTML=`<span class="status-dot ${s.config?.enabled?'on':''}"></span>${s.config?.enabled?'自動排程已啟用':'自動排程未啟用'} · 持股 ${(s.portfolio?.holdings||[]).length} · 觀察 ${(s.portfolio?.watchlist||[]).length}`;
        if(report){document.getElementById('newCount').textContent=report.summary?.new_count??0;document.getElementById('holdingImpact').textContent=report.summary?.holding_impacts??0;
          document.getElementById('generatedAt').textContent=String(report.generated_at||'').slice(0,19).replace('T',' ');
          renderEvents(report.top_events);renderActions(report.actions);renderProviders(s.config,report.provider_health);
          document.getElementById('gaps').innerHTML=(report.data_gaps||[]).map(g=>`<div class="gap">⚠️ ${esc(g)}</div>`).join('');
        }else{renderProviders(s.config,null)}
        renderCatalysts(c.catalysts);
      }catch(e){toast('讀取失敗：'+e.message)}
    }
    async function runNow(){
      const btn=document.getElementById('runBtn');btn.disabled=true;btn.textContent='更新中…';
      try{const res=await fetch('/api/intelligence/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'manual',dispatch:false})});
        const data=await res.json();toast(data.ok?'情報更新已啟動':(data.error||'啟動失敗'));if(data.ok){setTimeout(load,5000);setTimeout(load,15000)}}
      catch(e){toast('啟動失敗：'+e.message)}finally{setTimeout(()=>{btn.disabled=false;btn.textContent='立即更新'},1500)}
    }
    load();
  </script>
</body>
</html>
