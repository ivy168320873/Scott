# Alembic 設定（僅管理 Scott Studio 的 `studio_*` 資料表）。
#
# 注意：Scott 既有的 SQLite 資料表（user_data.db 等）不在 Alembic 管理範圍內，
# 也不會被任何 migration 觸及。

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# 連線字串刻意留空：實際值由 migrations/env.py 從 STUDIO_DATABASE_URL 環境變數讀取，
# 避免把資料庫帳密寫進版本控制。
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
