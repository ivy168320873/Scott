<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Polymarket Paper Trading Bot</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --fg:#e6edf3; --muted:#8b949e;
          --green:#3fb950; --red:#f85149; --accent:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { padding:16px 20px; border-bottom:1px solid var(--border);
           display:flex; align-items:center; gap:12px; }
  header h1 { font-size:18px; margin:0; }
  .badge { font-size:11px; padding:2px 8px; border-radius:10px; background:#1f6feb33;
           color:var(--accent); border:1px solid var(--accent); }
  .badge.paper { background:#3fb95022; color:var(--green); border-color:var(--green); }
  .grid { display:grid; gap:16px; padding:20px;
          grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px; }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em;
             color:var(--muted); margin:0 0 12px; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .stat { background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:10px; }
  .stat .label { font-size:11px; color:var(--muted); }
  .stat .value { font-size:20px; font-weight:600; margin-top:2px; }
  .pos { color:var(--green); } .neg { color:var(--red); }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:500; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .muted { color:var(--muted); }
  .pill { font-size:10px; padding:1px 6px; border-radius:8px; }
  .pill.buy { background:#3fb95022; color:var(--green); }
  .pill.sell { background:#f8514922; color:var(--red); }
  .pill.rej { background:#8b949e22; color:var(--muted); }
  .scroll { max-height:300px; overflow:auto; }
  footer { padding:12px 20px; color:var(--muted); font-size:11px; }
</style>
</head>
<body>
<header>
  <h1>Polymarket Paper Trading Bot</h1>
  <span class="badge paper" id="modeBadge">PAPER ONLY</span>
  <span class="muted" id="updated"></span>
</header>

<div class="grid">
  <div class="card" style="grid-column:1/-1">
    <h2>Performance</h2>
    <div class="stats" id="statsGrid"></div>
  </div>

  <div class="card">
    <h2>Live Markets</h2>
    <div class="scroll"><table id="marketsTbl">
      <thead><tr><th>Question</th><th class="num">Bid</th><th class="num">Ask</th><th class="num">Mid</th></tr></thead>
      <tbody></tbody></table></div>
  </div>

  <div class="card">
    <h2>Latest News</h2>
    <div class="scroll"><table id="newsTbl">
      <thead><tr><th>Title</th><th>Dir</th><th class="num">Rel</th><th class="num">Conf</th></tr></thead>
      <tbody></tbody></table></div>
  </div>

  <div class="card">
    <h2>Signals</h2>
    <div class="scroll"><table id="signalsTbl">
      <thead><tr><th>Side</th><th class="num">Edge</th><th class="num">Fair</th><th>Status</th></tr></thead>
      <tbody></tbody></table></div>
  </div>

  <div class="card">
    <h2>Open Paper Trades</h2>
    <div class="scroll"><table id="tradesTbl">
      <thead><tr><th>Side</th><th class="num">Size</th><th class="num">Entry</th><th class="num">Shares</th></tr></thead>
      <tbody></tbody></table></div>
  </div>
</div>

<footer>Auto-refresh every 3s · v1 paper trading — no live orders are ever placed.</footer>

<script>
const fmt = (x, d=4) => (x==null || isNaN(x)) ? "—" : Number(x).toFixed(d);
const cls = x => x==null ? "" : (x>=0 ? "pos" : "neg");

async function getJSON(u){ try{ const r=await fetch(u); return await r.json(); }catch(e){ return null; } }

function statCard(label, value, klass=""){
  return `<div class="stat"><div class="label">${label}</div>
          <div class="value ${klass}">${value}</div></div>`;
}

async function refresh(){
  const [stats, markets, news, signals, trades, health] = await Promise.all([
    getJSON("/api/stats"), getJSON("/api/markets"), getJSON("/api/news?limit=15"),
    getJSON("/api/signals?limit=15"), getJSON("/api/trades"), getJSON("/api/health")
  ]);

  if (health){
    document.getElementById("modeBadge").textContent =
      health.live_trading_enabled ? "LIVE (!)" : "PAPER ONLY";
  }

  if (stats){
    const g = document.getElementById("statsGrid");
    g.innerHTML =
      statCard("Total PnL", "$"+fmt(stats.total_pnl,2), cls(stats.total_pnl)) +
      statCard("Daily PnL", "$"+fmt(stats.daily_pnl,2), cls(stats.daily_pnl)) +
      statCard("Win Rate", fmt(stats.win_rate*100,1)+"%") +
      statCard("Trades", stats.total_trades) +
      statCard("Avg Edge", fmt(stats.avg_edge,4)) +
      statCard("Max Drawdown", "$"+fmt(stats.max_drawdown,2), "neg");
  }

  if (markets){
    document.querySelector("#marketsTbl tbody").innerHTML = markets.map(m =>
      `<tr><td>${m.question.slice(0,42)}</td>
       <td class="num">${fmt(m.best_bid)}</td>
       <td class="num">${fmt(m.best_ask)}</td>
       <td class="num">${fmt(m.mid_price)}</td></tr>`).join("");
  }

  if (news){
    document.querySelector("#newsTbl tbody").innerHTML = news.map(n =>
      `<tr><td>${(n.title||"").slice(0,40)}</td>
       <td>${n.direction||"—"}</td>
       <td class="num">${fmt(n.relevance_score,2)}</td>
       <td class="num">${fmt(n.confidence_score,2)}</td></tr>`).join("");
  }

  if (signals){
    document.querySelector("#signalsTbl tbody").innerHTML = signals.map(s => {
      const p = s.side==="BUY_YES" ? "buy" : "sell";
      const st = s.status==="rejected" ? "rej" : (s.side==="BUY_YES"?"buy":"sell");
      return `<tr><td><span class="pill ${p}">${s.side}</span></td>
       <td class="num">${fmt(s.edge)}</td>
       <td class="num">${fmt(s.fair_price)}</td>
       <td><span class="pill ${st}">${s.status}</span></td></tr>`;
    }).join("");
  }

  if (trades){
    document.querySelector("#tradesTbl tbody").innerHTML = trades.length ? trades.map(t =>
      `<tr><td><span class="pill ${t.side==='BUY_YES'?'buy':'sell'}">${t.side}</span></td>
       <td class="num">$${fmt(t.size_usd,0)}</td>
       <td class="num">${fmt(t.entry_price)}</td>
       <td class="num">${fmt(t.shares,1)}</td></tr>`).join("")
      : `<tr><td colspan="4" class="muted">No open positions</td></tr>`;
  }

  document.getElementById("updated").textContent = "updated " + new Date().toLocaleTimeString();
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
